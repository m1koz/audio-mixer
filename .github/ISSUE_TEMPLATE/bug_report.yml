name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: AudioMixer version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1 (25B…)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Output device
      description: For audio issues — which device was selected (built-in speakers, AirPods, USB …)?
  - type: input
    id: app
    attributes:
      label: Affected app
      description: Which app's audio was involved (Safari, Spotify, Discord …)?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, whether the app is in "Other Apps", language, appearance settings.
