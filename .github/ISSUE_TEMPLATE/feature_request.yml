name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what's missing today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Your idea of the ideal behavior. Screenshots or sketches welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mixer
        - Equalizer
        - Routing / devices
        - Menu bar
        - Appearance
        - Localization
        - Other
